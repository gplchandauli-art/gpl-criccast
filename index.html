<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GPL CricCast Pro V4.1 • Broadcast Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+Devanagari:wght@600;800;900&family=Teko:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{font-family:'Noto Sans Devanagari','Chakra Petch',sans-serif;background:#eef2f6;color:#0f172a;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.font-score{font-family:'Teko',sans-serif;letter-spacing:.5px}
.font-broadcast{font-family:'Chakra Petch','Noto Sans Devanagari',sans-serif}
html:has(body.overlay-only),body.overlay-only{background:transparent!important;overflow:hidden!important;margin:0!important;padding:0!important;width:100vw;height:100vh}
body.overlay-only .admin-section{display:none!important}
body.overlay-only .overlay-stage{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;background:transparent!important;border:none!important;padding:0 12px 14px!important;display:flex!important;flex-direction:column!important;justify-content:flex-end!important}
body:not(.overlay-only) #fullTvCardContainer{position:relative!important;inset:auto!important;padding:.5rem 0 0!important;pointer-events:auto!important}
body.overlay-only #cardCloseAdminBtn{display:none!important}
.tv-capsule{background:linear-gradient(180deg,#fff 0%,#f8fafc 100%);border:2px solid #cbd5e1;box-shadow:0 14px 35px rgba(2,6,23,.45),inset 0 2px 0 #fff}
.center-score-pill{background:linear-gradient(135deg,#be123c 0%,#e11d48 54%,#0284c7 54.5%,#0369a1 100%);box-shadow:0 6px 18px rgba(190,18,60,.38)}
.bottom-eq-pill{background:linear-gradient(90deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%)}
.over-circle{width:23px;height:23px;border-radius:9999px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;font-family:'Chakra Petch',sans-serif}
.over-circle-empty{border:2px solid #94a3b8;background:#fff;color:transparent}
.icc-card-bg{background:linear-gradient(135deg,#2e0642 0%,#4a0d67 50%,#1e0530 100%);border:2px solid rgba(255,255,255,.35);box-shadow:0 25px 65px rgba(0,0,0,.9)}
.icc-sub-bar{background:linear-gradient(90deg,#9d174d 0%,#be185d 50%,#831843 100%)}
.icc-fow-bar{background:linear-gradient(90deg,#1d4ed8 0%,#2563eb 50%,#1e40af 100%)}
@keyframes eventPop{0%{transform:scale(.55) translateY(30px);opacity:0}15%{transform:scale(1.06) translateY(0);opacity:1}85%{transform:scale(1) translateY(0);opacity:1}100%{transform:scale(.85) translateY(-20px);opacity:0}}
.animate-tv-event{animation:eventPop 3.4s cubic-bezier(.22,1,.36,1) forwards}
.ctrl-btn{transition:transform .08s ease;box-shadow:0 3px 0 rgba(15,23,42,.18)}
.ctrl-btn:active{transform:translateY(2px) scale(.97)}
</style>
</head>
<body id="appBody">

<header class="admin-section sticky top-0 z-40 bg-slate-950 text-white border-b border-slate-800 px-3 py-2 shadow-md">
<div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-lg bg-gradient-to-br from-rose-500 to-sky-600 flex items-center justify-center"><i class="fa-solid fa-tower-broadcast text-white text-sm"></i></div>
<div>
<div class="flex items-center gap-1.5"><h1 class="text-sm font-black uppercase">GPL CricCast <span class="text-sky-400">Pro</span></h1><span class="px-1.5 py-0.5 text-[10px] font-extrabold rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">V4.1 TOSS</span></div>
<div class="flex items-center gap-2 text-[10px]"><span id="syncStatusBadge" class="inline-flex items-center gap-1 font-bold text-emerald-400"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> Cloud Live</span><span class="text-slate-500">|</span><span class="text-slate-300">Room: <strong id="headerRoomDisplay" class="font-mono text-amber-300">GPL2026</strong></span></div>
</div>
</div>
<div class="flex items-center gap-1.5">
<button onclick="openNewMatchTossModal()" class="px-2.5 py-1.5 rounded-lg bg-amber-500 text-slate-950 text-xs font-black shadow">New Match / Toss</button>
<button onclick="copyShareLink('overlay')" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-extrabold shadow"><i class="fa-solid fa-tv"></i> URL</button>
</div>
</div>
<div id="copyToast" class="hidden max-w-5xl mx-auto mt-2 p-2 rounded-lg bg-emerald-950 border border-emerald-500 text-emerald-200 text-xs space-y-1">
<div class="font-bold flex justify-between"><span>Prism Live Transparent Link:</span><button onclick="document.getElementById('copyToast').classList.add('hidden')" class="px-1">✕</button></div>
<input type="text" id="directOverlayUrlBox" readonly onclick="this.select()" class="w-full bg-slate-950 border border-emerald-600 rounded px-2 py-1 text-[11px] font-mono text-white select-all">
</div>
</header>

<section id="overlayStage" class="overlay-stage relative w-full bg-slate-800 border-b-2 border-slate-300 px-2 sm:px-5 pt-7 pb-3 flex flex-col justify-end min-h-[185px] sm:min-h-[215px] select-none">
<div class="admin-section absolute top-1.5 left-3 right-3 flex items-center justify-between text-[10px] font-bold text-slate-200">
<span class="bg-slate-900/90 border border-slate-700 px-2 py-0.5 rounded-full"><i class="fa-solid fa-eye text-sky-400 mr-1"></i> Live TV Preview</span>
<span id="quotaAlertBadge" class="hidden bg-rose-600 text-white px-2.5 py-0.5 rounded-full animate-bounce">बॉलर का ओवर कोटा पूरा!</span>
</div>

<div id="tvEventOverlay" class="pointer-events-none fixed inset-x-0 top-1/4 flex justify-center items-center z-50 hidden">
<div id="tvEventCard" class="px-8 py-4 rounded-2xl border-2 border-white/50 shadow-2xl text-center">
<div id="tvEventTitle" class="font-score text-6xl sm:text-7xl font-bold text-white leading-none">FOUR!</div>
<div id="tvEventSub" class="text-xs sm:text-sm font-extrabold uppercase text-amber-200 mt-1">BOUNDARY</div>
</div>
</div>

<div id="fullTvCardContainer" class="hidden fixed inset-0 z-30 flex items-center justify-center p-2 sm:p-5 pointer-events-none mb-2">
<div class="icc-card-bg w-full max-w-3xl mx-auto rounded-xl overflow-hidden text-white pointer-events-auto">
<div class="flex justify-between items-center bg-slate-950/90 px-3 py-1 border-b border-white/15">
<span id="cardTourneyPill" class="text-[10px] font-black uppercase tracking-widest text-amber-300">GPL SPORTS LIVE</span>
<button id="cardCloseAdminBtn" onclick="setOverlayScreen('default')" class="px-2.5 py-0.5 rounded bg-rose-600 text-white text-[11px] font-extrabold">✕ Close</button>
</div>
<div class="bg-white text-slate-950 px-4 py-2 flex items-center justify-between font-broadcast">
<div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-blue-600"></span><span id="cardTeam1Title" class="text-sm sm:text-lg font-black uppercase">TEAM A</span></div>
<div class="px-3 py-0.5 rounded-full bg-purple-900 text-amber-300 text-[10px] sm:text-xs font-black uppercase" id="cardCenterTag">SCORECARD</div>
<div class="flex items-center gap-2"><span id="cardTeam2Title" class="text-sm sm:text-lg font-black uppercase">TEAM B</span><span class="w-3 h-3 rounded-full bg-emerald-600"></span></div>
</div>
<div class="icc-sub-bar px-4 py-1 text-center text-[11px] font-black uppercase tracking-wider text-white" id="cardSubTitle">MATCH SUMMARY</div>
<div id="cardBodyContent" class="p-3 sm:p-4 text-xs sm:text-sm max-h-[62vh] overflow-y-auto"></div>
</div>
</div>

<div id="customTickerBanner" class="hidden w-full max-w-[1160px] mx-auto mb-1.5">
<div class="bg-slate-950 border border-amber-400/60 text-amber-200 px-4 py-1 rounded-full text-center text-xs font-extrabold"><i class="fa-solid fa-bullhorn text-amber-400 mr-1"></i><span id="customTickerText"></span></div>
</div>

<div id="mainScorebugWrapper" class="w-full max-w-[1180px] mx-auto relative">
<div class="flex items-center justify-between px-3 mb-1">
<div class="flex items-center gap-1.5">
<span id="ovPowerplayBadge" class="hidden px-2.5 py-0.5 rounded-full bg-amber-500 text-slate-950 text-[10px] font-black uppercase">POWERPLAY</span>
<span id="ovFreeHitBadge" class="hidden px-3 py-0.5 rounded-full bg-rose-600 text-white text-[11px] font-black uppercase animate-pulse border border-white">🔥 FREE HIT!</span>
</div>
<div class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white px-3.5 py-0.5 rounded-t-xl text-[10px] sm:text-[11px] font-black uppercase tracking-wider border-t border-x border-sky-400/40"><span id="ovTournamentTag">GPL SPORTS LIVE • CHANDAULI</span></div>
</div>

<div class="tv-capsule rounded-2xl md:rounded-full px-2.5 sm:px-4 py-2 flex flex-col md:flex-row items-center justify-between gap-2">
<div class="w-full md:w-[34%] flex items-center justify-between gap-2 pr-1">
<div class="shrink-0 text-center min-w-[74px] border-r-2 border-slate-200 pr-2">
<div id="ovBatTeamLogo" class="text-xs sm:text-sm font-black uppercase text-slate
